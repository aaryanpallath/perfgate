name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -v
      # End-to-end on the runner's CPU: sweep twice, then gate one run against the other.
      # Exit 1 (regression) is not expected for identical code, but shared runners are noisy,
      # so the result is reported rather than failing the build.
      - run: uv run perfgate sweep configs/ci_smoke.yaml --out ci/base.jsonl
      - run: uv run perfgate sweep configs/ci_smoke.yaml --out ci/cand.jsonl
      - run: uv run perfgate report ci/base.jsonl
      - run: uv run perfgate compare ci/base.jsonl ci/cand.jsonl || echo "gate exit code $?"
      - run: uv run perfgate slurm configs/m4_sweep.yaml --partition gpu
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t perfgate .
      - run: docker run --rm perfgate sweep configs/ci_smoke.yaml --out /tmp/r.jsonl
